name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify game logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The game has no dependencies and no build step; these run the real
      # engine and the real netcode headlessly.
      - name: Deck integrity
        run: node tests/check-data.mjs
      - name: Scene tile vetting
        run: node tests/check-tiles.mjs
      - name: Rules engine (1200 randomised games)
        run: node tests/sim.mjs
      - name: Netcode (host + clients over a reordering transport)
        run: node tests/net-sim.mjs
      - name: Card art
        run: node tests/check-art.mjs

  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The site is served exactly as it sits in the repository.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
