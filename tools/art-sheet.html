<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Art Sheet</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 1.4rem 1.4rem 4rem;
    background: #0d0c11; color: #d9d3c6;
    font: 15px/1.5 Georgia, 'Times New Roman', serif;
  }
  h1 { font-size: 1.35rem; letter-spacing: .06em; margin: 0 0 .3rem; }
  .lede { color: #9a9384; max-width: 66ch; margin-bottom: 1.2rem; }
  .bar {
    position: sticky; top: 0; z-index: 5;
    display: flex; gap: .6rem; align-items: center; flex-wrap: wrap;
    background: #0d0c11ee; backdrop-filter: blur(6px);
    padding: .7rem 0; margin-bottom: 1rem; border-bottom: 1px solid #2e2b36;
  }
  button, select {
    font: inherit; font-size: .85rem;
    background: #1e1c25; color: #d9d3c6;
    border: 1px solid #3a3644; border-radius: 4px; padding: .4rem .8rem; cursor: pointer;
  }
  button:hover { border-color: #c9a227; }
  .count { margin-left: auto; color: #9a9384; font-size: .85rem; }
  h2 { font-size: .78rem; letter-spacing: .22em; text-transform: uppercase;
       color: #c9a227; font-weight: normal; margin: 1.8rem 0 .7rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--w, 132px), 1fr)); gap: .7rem; }
  figure { margin: 0; }
  figure img { display: block; width: 100%; aspect-ratio: 100/130; border-radius: 4px;
               border: 2px solid #3a3644; background: #cdbf9f; }
  figure.means img { border-color: #d08a2c; }
  figure.clue  img { border-color: #6d97b4; }
  figcaption { font-size: .68rem; color: #6b6558; font-family: ui-monospace, Consolas, monospace;
               padding-top: .25rem; word-break: break-all; }
  figure.missing img { outline: 3px solid #c02f2f; outline-offset: 2px; }
  figure.missing figcaption { color: #c02f2f; }
</style>
</head>
<body>

<h1>Card Art Sheet</h1>
<p class="lede">
  Every card plate as it actually renders. Cards still falling back to a generic
  motif icon (no per-item drawing yet) are outlined in red.
</p>

<div class="bar">
  <button id="big">Larger</button>
  <button id="small">Smaller</button>
  <select id="filter">
    <option value="all">All cards</option>
    <option value="means">Means of Murder</option>
    <option value="clues">Key Evidence</option>
    <option value="missing">Missing drawings only</option>
  </select>
  <span class="count" id="count"></span>
</div>

<div id="body"></div>

<script type="module">
import { MEANS } from '../js/data/means.js';
import { CLUES } from '../js/data/clues.js';
import { cardArtSVG, svgDataUri } from '../js/art/procedural.js';
import { ITEM_GLYPHS } from '../js/art/glyphs/index.js';

let w = 132;

function render() {
  const filter = document.querySelector('#filter').value;
  const body = document.querySelector('#body');
  body.innerHTML = '';
  document.documentElement.style.setProperty('--w', w + 'px');

  const decks = [['means', 'Means of Murder', MEANS], ['clues', 'Key Evidence', CLUES]];
  let shown = 0, missing = 0;

  for (const [kind, label, items] of decks) {
    const list = items.filter(it => {
      const has = !!ITEM_GLYPHS[it.img];
      if (!has) missing++;
      if (filter === 'missing') return !has;
      if (filter === 'all') return true;
      return filter === kind;
    });
    if (!list.length) continue;

    const h = document.createElement('h2');
    h.textContent = `${label} — ${list.length}`;
    body.append(h);

    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const it of list) {
      const fig = document.createElement('figure');
      fig.className = (kind === 'means' ? 'means' : 'clue') + (ITEM_GLYPHS[it.img] ? '' : ' missing');
      const img = new Image();
      img.src = svgDataUri(cardArtSVG(it, kind));
      img.alt = it.name;
      const cap = document.createElement('figcaption');
      cap.textContent = it.img;
      fig.append(img, cap);
      grid.append(fig);
      shown++;
    }
    body.append(grid);
  }

  const total = MEANS.length + CLUES.length;
  const drawn = total - missing;
  document.querySelector('#count').textContent =
    `${shown} shown · ${drawn}/${total} have their own drawing`;
}

document.querySelector('#filter').addEventListener('change', render);
document.querySelector('#big').addEventListener('click', () => { w = Math.min(280, w + 34); render(); });
document.querySelector('#small').addEventListener('click', () => { w = Math.max(76, w - 34); render(); });
render();
</script>
</body>
</html>
